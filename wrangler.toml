name = "ghl-deal-ledger"
main = "ghl-deal-ledger-worker.js"
compatibility_date = "2024-01-01"

[observability]
enabled = true

  [observability.logs]
  invocation_logs = true
  head_sampling_rate = 1

# KV namespace used to cache the Google access token (code binding: GHL_KV).
# Replace the id below with the REAL namespace id from Cloudflare:
#   Dashboard -> Storage & Databases -> KV  (copy the ID next to the namespace)
#   or: worker -> Settings -> Bindings -> the GHL_KV binding shows its namespace id
[[kv_namespaces]]
binding = "GHL_KV"
id = "PASTE_REAL_KV_NAMESPACE_ID_HERE"

# IMPORTANT: Do NOT add a [vars] block for SPREADSHEET_ID, GOOGLE_CLIENT_EMAIL,
# SHEET_NAME, GOOGLE_PRIVATE_KEY, or PANDADOC_WEBHOOK_SECRET.
# Those are already stored on the Worker as secrets. Declaring them here would
# overwrite the real values on every deploy (which is what just broke the build).
